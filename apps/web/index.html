<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfaf8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d1017" />

    <title>Meridian Advisory — Clarity for your next important decision</title>
    <meta
      name="description"
      content="Strategy, finance and operations advisory for organisations at an inflection point. Book a working session with a practitioner who has run the thing they advise on."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script>
      // Applies the stored theme before first paint, so a dark-mode user never
      // sees a white flash while the React bundle loads.
      (function () {
        try {
          var stored = localStorage.getItem('meridian:theme');
          var dark =
            stored === 'dark' ||
            ((!stored || stored === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (error) {
          /* Storage unavailable — the app resolves the theme on mount instead. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 3rem; font-family: system-ui, sans-serif; text-align: center">
        <h1>JavaScript is required</h1>
        <p>
          The Meridian Advisory booking platform needs JavaScript. Please enable it, or contact us at
          <a href="mailto:hello@meridianadvisory.co.ke">hello@meridianadvisory.co.ke</a>.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
